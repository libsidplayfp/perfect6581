name: CI

on:
  push:
    branches:
      - master
      - dev/**
  pull_request:
    branches:
      - master
      - dev/**

permissions:
  contents: read
  pull-requests: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
#    - name: deps
#      run: |
#        sudo apt-get update
#        sudo apt-get install
    - name: build
      run: |
         make && make test
    - name: test
      run: |
         ./test
